mode: strategy
log_level: info
unified_api:
  listen: 0.0.0.0:9788
  password: change-me
control_plane:
  enabled: true
  read_token: change-me
  mutate_token: change-me
  require_actor: true
  localhost_only: false
  allowlist: []
  token_grace_period: 15m
strategy:
  mode: balance
  failure_threshold: 10
  cooldown_duration: 30m
  fallback_on_retryable_errors: true
  max_fallback_attempts: 10
  retryable_categories:
  - transport_error
  - delegation_error
  - timeout_error
  - service_unavailable
  - unsupported_operation
  operation_policies:
    codex.semantic.step:
      fallback_mode: enabled
      max_fallback_attempts: 10
      retryable_categories:
      - transport_error
      - delegation_error
      - timeout_error
      - service_unavailable
      - unsupported_operation
error_attribution:
  enabled: true
tracing:
  enabled: true
  history_limit: 200
persistence:
  enabled: true
  runtime_state_path: /var/lib/easy-protocol/runtime-overrides.json
  control_plane_state_path: /var/lib/easy-protocol/control-plane-state.json
  audit_log_path: /var/lib/easy-protocol/audit-log.jsonl
  snapshot_dir: /var/lib/easy-protocol/runtime-snapshots
  audit_history_limit: 500
  snapshot_limit: 200
services:
- name: PythonProtocol-001
  language: python
  endpoint: http://easy-protocol-python-001:9100
  enabled: true
  supported_operations:
  - codex.semantic.step
managed_provider_runtime:
  enabled: true
  docker_host: unix:///var/run/docker.sock
  compose_project: easy-protocol
  network_name: EasyAiMi
  providers:
    python:
      enabled: true
      image: easy-protocol/easy-protocol-python:local
      service_name_prefix: PythonProtocol
      container_name_prefix: easy-protocol-python
      endpoint_host_prefix: easy-protocol-python
      port: 9100
      published_port_base: 11003
      supported_operations:
      - codex.semantic.step
      environment:
        PYTHONUNBUFFERED: '1'
        PYTHON_PROTOCOL_HOST: 0.0.0.0
        PYTHON_PROTOCOL_PORT: '9100'
        MAILBOX_SERVICE_BASE_URL: http://easy-email:8080
        MAILBOX_SERVICE_API_KEY: ''
        MAILBOX_SERVICE_REQUEST_ATTEMPTS: '8'
        EASY_PROXY_BASE_URL: http://easy-proxy:29888
        EASY_PROXY_API_KEY: ''
        REGISTER_ENABLE_EASY_PROXY: 'true'
        REGISTER_REQUIRE_EASY_PROXY: 'true'
        REGISTER_TEAM_AUTH_DIR: /shared/team-auth
        REGISTER_TEAM_AUTH_GLOB: '*-team.json'
        REGISTER_TEAM_CAPACITY_LIMIT: '9'
        REGISTER_TEAM_INVITE_SWEEP_AGE_SECONDS: '180'
        REGISTER_FREE_MANUAL_OAUTH_PRESERVE_ENABLED: 'false'
        REGISTER_R2_ACCESS_KEY_ID: ''
        REGISTER_R2_SECRET_ACCESS_KEY: ''
        REGISTER_R2_ACCOUNT_ID: ''
        REGISTER_R2_BUCKET: ''
        REGISTER_R2_ENDPOINT_URL: ''
        REGISTER_R2_REGION: auto
        REGISTER_R2_PUBLIC_BASE_URL: ''
        M2U_EASY_PROXY_MAX_ATTEMPTS: '10'
      host_mounts:
      - source: C:/EasyProtocol/register-output
        target: /shared/register-output
        read_only: false
      - source: C:/Users/vmjcv/.cli-proxy-api/team
        target: /shared/team-auth
        read_only: true
      - source: C:/Users/vmjcv/.cli-proxy-api/team
        target: /shared/local-team-store
        read_only: false
